[package]
name = "ultramp3_windows"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Menyertakan skin Default HD dan font HD dari assets/default-hd.
# Aktifkan dengan `cargo build --features hd` hanya bila folder aset itu ada.
hd = []

[dependencies]
eframe = "0.32"
image = { version = "0.25", default-features = false, features = ["png"] }
id3 = "1.17.2"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"
tempfile = "3"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-mp3", "wav"] }
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioBuffer", "AudioBufferSourceNode", "AudioContext", "AudioDestinationNode",
    "AudioNode", "AudioParam", "AudioScheduledSourceNode", "GainNode", "HtmlCanvasElement", "Storage", "Window",
] }
