; component definition
; syntax:
; <index>: <pos_x> <pos_y> [ <color0> [ <color1> [ <color2> ] ] ]
; position specifies left top corner of each component (in pixels)
; colors are optional, up to 3 colors per component may be specified (they're used depending on component type)
; colors are in RRGGBB hex format; if colors are not specified, they default to white

; song name (3 colors, used for: song title / file name / song details
0: 32 22 00C0FF FFFF00 FF80FF

; song count
1: 2 22

; song time
2: 8 37

; curr time (no colors, drawn by big digital sprite numbers)
3: 105 37

; song info big (3 colors, used for: MOD: voice index / sample name / note; MP3: ID3 tags)
4: 5 60 C0C0C0

; song info small (2 colors, used for: MOD: track pos / row pos; MP3: bitdepth / frequency)
5: 45 36

; volume (no colors, drawn as sprite)
6: 154 56

; buttons (no colors)
7: 47 190

; visualization rectangle left-top corner (colors used in visualization drawing)
; colors: color0 = osciloscope color; color1 = spectrum peaks, color2 = osciloscope channel2 color (for stereo)
8: 6 143 ffffff ffffff 0000ff

; visualization rectangle size
9: 165 41

